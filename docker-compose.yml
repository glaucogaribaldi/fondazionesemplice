name: fondazionesemplice

x-common: &common
  restart: unless-stopped
  networks: [foundation]
  security_opt: ["no-new-privileges:true"]

services:
  decision-service:
    <<: *common
    build:
      context: ./services/decision-service
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      LIVE_ENABLED: ${LIVE_ENABLED:-false}
      LIVE_CONFIRMATION: ${LIVE_CONFIRMATION:-}
      DECISION_API_KEY: ${DECISION_API_KEY:?set DECISION_API_KEY in .env}
      AI_BACKEND: ${AI_BACKEND:-mock}
      KRONOS_URL: ${KRONOS_URL:-http://kronos:8081}
      NEMOTRON_URL: ${NEMOTRON_URL:-http://nemotron:30000/v1}
      NEMOTRON_MODEL: ${NEMOTRON_MODEL:-nvidia/NVIDIA-Nemotron-Nano-9B-v2}
      DECISION_TIMEOUT_SECONDS: ${DECISION_TIMEOUT_SECONDS:-20}
      DATABASE_URL: ${DATABASE_URL:-postgresql://fondazione:fondazione@postgres:5432/fondazione}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      kronos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 5

  kronos:
    <<: *common
    build:
      context: ./services/kronos
    environment:
      KRONOS_BACKEND: ${KRONOS_BACKEND:-mock}
      KRONOS_MODEL: NeoQuasar/Kronos-base
      KRONOS_TOKENIZER: NeoQuasar/Kronos-Tokenizer-base
      HF_HOME: /models/huggingface
    volumes:
      - model-cache:/models
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  nemotron-mock:
    <<: *common
    profiles: [mock]
    build:
      context: ./services/nemotron-mock
    ports:
      - "127.0.0.1:30000:30000"

  nemotron:
    <<: *common
    profiles: [gpu]
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:v0.5.15.post1}
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - ${NEMOTRON_MODEL:-nvidia/NVIDIA-Nemotron-Nano-9B-v2}
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --mem-fraction-static
      - ${SGLANG_MEM_FRACTION:-0.88}
      - --trust-remote-code
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /models/huggingface
    volumes:
      - model-cache:/models
    ipc: host
    shm_size: 16gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "127.0.0.1:30000:30000"
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:30000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  arena:
    <<: *common
    build:
      context: ./services/arena
    environment:
      DECISION_URL: http://decision-service:8080
      DECISION_API_KEY: ${DECISION_API_KEY:?set DECISION_API_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:-postgresql://fondazione:fondazione@postgres:5432/fondazione}
      INITIAL_CAPITAL: ${ARENA_INITIAL_CAPITAL:-310}
      ARENA_DB_PATH: /data/arena.db
      PAPER_FEE_BPS: ${PAPER_FEE_BPS:-60}
      PAPER_SLIPPAGE_BPS: ${PAPER_SLIPPAGE_BPS:-5}
    volumes:
      - ./config:/app/config:ro
      - arena-data:/data
    depends_on:
      decision-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8082/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 5

  market-feed:
    <<: *common
    build:
      context: ./services/market-feed
    environment:
      ARENA_URL: http://arena:8082
      DECISION_API_KEY: ${DECISION_API_KEY:?set DECISION_API_KEY in .env}
      COINBASE_PRODUCTS: ${COINBASE_PRODUCTS:-BTC-USDC,ETH-USDC}
      MARKET_TIMEFRAME_SECONDS: ${MARKET_TIMEFRAME_SECONDS:-300}
      MARKET_POLL_SECONDS: ${MARKET_POLL_SECONDS:-30}
      MARKET_CANDLE_LIMIT: ${MARKET_CANDLE_LIMIT:-96}
    depends_on:
      arena:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8083/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 5

  octobot:
    <<: *common
    image: ${OCTOBOT_IMAGE:-drakkarsoftware/octobot:2.1.1}
    volumes:
      - ./octobot/user:/octobot/user
      - ./octobot/tentacles:/octobot/tentacles
      - ./octobot/logs:/octobot/logs
      - ./octobot/backtesting:/octobot/backtesting
    ports:
      - "${OCTOBOT_BIND:-127.0.0.1}:${OCTOBOT_PORT:-5001}:5001"

  postgres:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fondazione}
      POSTGRES_USER: ${POSTGRES_USER:-fondazione}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    <<: *common
    profiles: [observability]
    image: prom/prometheus:v2.54.1
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    <<: *common
    profiles: [observability]
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]

networks:
  foundation:
    driver: bridge

volumes:
  arena-data:
  model-cache:
  postgres-data:
  prometheus-data:
  grafana-data:
